{% extends "base.html" %}
{% block title %}ReU | Eliminar{% endblock %}
{% block content %}
<div class="form-card">
    <h1>Eliminar publicación</h1>
    <p>¿Seguro que quieres eliminar <strong>{{ publicacion.titulo }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn danger" type="submit">Sí, eliminar</button>
        <a class="btn secondary" href="{% url 'detalle' publicacion.pk %}">Cancelar</a>
    </form>
</div>
{% endblock %}
